# docker-compose.yml — Ambiente de desarrollo · Sistema de Posgrado UTN FRLP
# Levantar: docker compose up        (agregar -d para segundo plano)
# Detener:  docker compose down      (agregar -v para borrar la base de datos)
# Logs:     docker compose logs -f [postgres|backend|frontend]

services:
  # ──────────────────────────────────────────
  # BASE DE DATOS — PostgreSQL 18.6
  # ──────────────────────────────────────────
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${DB_USER:-postgrado_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrado_dev_password}
      POSTGRES_DB: ${DB_NAME:-postgrado_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ guarda los datos en /var/lib/postgresql/<versión>/docker
      - pgdata:/var/lib/postgresql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  # BACKEND — FastAPI + uv (Python 3.12)
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgrado_user}:${DB_PASSWORD:-postgrado_dev_password}@postgres:5432/${DB_NAME:-postgrado_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      STORAGE_PATH: /var/postgrado-storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - storage:/var/postgrado-storage

  # ──────────────────────────────────────────
  # FRONTEND — React 19 + Vite + pnpm
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    environment:
      # El proxy de Vite reenvía /api/* al backend por la red interna de Compose
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  storage:
