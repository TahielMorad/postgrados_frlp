# CI — Sistema de Posgrado
# Corre en cada push y PR a dev/main. Valida que backend, frontend y el
# docker compose de desarrollo sigan construyendo. (Tests: a futuro.)

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (FastAPI + uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"

      - name: Instalar dependencias (lockfile congelado)
        run: uv sync --frozen

      - name: Verificar que la app importa
        run: uv run python -c "import main; print(main.app.title)"

  frontend:
    name: Frontend (React + Vite + pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato (Prettier)
        run: pnpm format:check

      - name: Build
        run: pnpm build

  compose:
    name: Docker Compose de desarrollo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Construir imágenes
        run: docker compose build
